apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketstage-root-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/PlatypusInAHat/ticket-infra
    targetRevision: main
    path: argocd/applications/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
