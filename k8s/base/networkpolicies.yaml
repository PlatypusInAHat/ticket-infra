apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: ticketstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ticketstage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 5000 }
        - { protocol: TCP, port: 5101 }
        - { protocol: TCP, port: 5102 }
        - { protocol: TCP, port: 5103 }
        - { protocol: TCP, port: 5104 }
        - { protocol: TCP, port: 5105 }
