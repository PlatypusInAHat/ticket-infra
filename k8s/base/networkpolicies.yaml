metadata:
  name: allow-inventory-summary-mongo-egress
  namespace: ticketstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory-summary-sync
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: TCP
          port: 27017
