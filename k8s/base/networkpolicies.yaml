apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-telemetry-egress
  namespace: ticketstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ticketstage
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-service-egress
  namespace: ticketstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-service
                  - catalog-service
                  - booking-service
                  - checkin-service
                  - notification-service
      ports:
        - protocol: TCP
          port: 5101
        - protocol: TCP
          port: 5102
        - protocol: TCP
          port: 5103
        - protocol: TCP
          port: 5104
        - protocol: TCP
          port: 5105
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-service-egress
  namespace: ticketstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - catalog-service
                  - booking-service
                  - checkin-service
      ports:
        - { protocol: TCP, port: 5102 }
        - { protocol: TCP, port: 5103 }
        - { protocol: TCP, port: 5104 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 27017 }
        - { protocol: TCP, port: 5671 }
---
